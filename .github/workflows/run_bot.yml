name: Run Cybersecurity News Bot

on:
  schedule:
    # Ejecutar cada hora (minuto 50)
    - cron: '50 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write # Permite al workflow hacer push del archivo sent_articles.json actualizado

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Clonar historial completo para evitar problemas con commits y push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run news bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        POLLING_INTERVAL_MINUTES: 60
      run: |
        python main.py --once

    - name: Commit and push if sent_articles.json changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_articles.json
        # Solo hacer commit y push si hay cambios locales reales
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent articles [skip ci]" && git push)
